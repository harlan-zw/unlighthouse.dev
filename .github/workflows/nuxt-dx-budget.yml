name: Nuxt DX budget

on:
  # A full production build, run only to measure one bundle. A docs-only change
  # moves nothing this workflow measures, so it skips itself.
  #
  # `*.md` is single-star on purpose: it matches root markdown only. Site
  # content lives in `content/`, which Nuxt Content reads at build time, so a
  # blanket `**.md` ignore would stop budgeting the markdown that counts.
  #
  # The list repeats because GitHub's workflow parser has no YAML anchors.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - .editorconfig
      - .gitignore
      - '.idea/**'
      - '.vscode/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - .editorconfig
      - .gitignore
      - '.idea/**'
      - '.vscode/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  # the budget action comments the diff on the pull request
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-${{ github.sha }}
          restore-keys: |
            nuxt-skew-
      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=14000
          NUXT_GITHUB_ACCESS_TOKEN: ${{ secrets.NUXT_GITHUB_ACCESS_TOKEN || github.token }}
          NUXT_GITHUB_AUTH_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN || github.token }}
      - uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@main
        with:
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
