name: CI

# The pull request gate. This repository had no check of any kind: lint,
# typecheck, and test ran nowhere, and deploy-cloudflare.yml built and shipped
# every push to main unvalidated.
#
# The jobs live in harlan-zw/harlan-nuxt so every site shares one pinned copy.

# Pull requests always start a run. The `changes` job decides whether the
# checks run or skip, because `harlan-desktop / lint`, `/ typecheck` and
# `/ test` are required checks. A path filter at the event starts no run for a
# docs-only pull request, so the required checks never report and it blocks. A
# skipped check passes.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # GitHub-hosted for the same reason as the checks: this repository is public.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0
      # Push builds always run in full. A pull request runs the checks when any
      # changed file is code, or site content that renders.
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            files=$(git diff --name-only "$BASE...$HEAD")
            code=false
            while IFS= read -r file; do
              case "$file" in
                content/*) code=true; break ;;
                *.md|docs/*|.editorconfig|.gitignore|.idea/*|.vscode/*|'') ;;
                *) code=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  harlan-desktop:
    needs: changes
    if: ${{ !cancelled() }}
    uses: harlan-zw/harlan-nuxt/.github/workflows/harlan-desktop-site-ci.yml@main
    with:
      node-version: 26.13.0
      skip: ${{ needs.changes.outputs.code == 'false' }}
      # GitHub-hosted on purpose. This repository is public, and a self-hosted
      # runner on a public repository lets a fork pull request run code on the
      # workstation.
      runs-on: '["ubuntu-24.04"]'
      # `postinstall` runs `nuxt prepare`, which typecheck resolves aliases
      # through.
      install-args: ''
      # `test` is `node --test`; there is no `test:run` script.
      test-command: pnpm test
      typecheck-node-options: --max-old-space-size=14000
      timeout-minutes: 30

  build:
    # Main builds in the deploy workflow. Keep the build check on pull requests.
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-${{ github.sha }}
          restore-keys: |
            nuxt-skew-
      - name: Cache prerendered OG images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/og-image
          key: og-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'app/assets/**', 'app/components/OgImage/**', 'public/**') }}-${{ github.sha }}
          restore-keys: |
            og-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'app/assets/**', 'app/components/OgImage/**', 'public/**') }}-

      - run: pnpm build
        env:
          NODE_OPTIONS: --max-old-space-size=14000
          NUXT_GITHUB_ACCESS_TOKEN: ${{ secrets.NUXT_GITHUB_ACCESS_TOKEN || github.token }}
          NUXT_GITHUB_AUTH_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN || github.token }}
          # Fork pull requests cannot read secrets. The PR build artifact is never
          # deployed, so a placeholder password is enough to prerender clean.
          NUXT_SESSION_PASSWORD: pr-build-session-password-placeholder
          # No github.token fallback: it cannot read sponsors, so fork builds skip the prerender.
          NUXT_GITHUB_SPONSORS_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
