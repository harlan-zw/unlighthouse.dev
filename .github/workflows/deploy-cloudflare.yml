name: Deploy to Cloudflare

# Deploys directly on pushes to main because branch protection already enforces
# CI on pull requests.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - README.md
      - AGENTS.md
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: >-
    ${{ github.ref == 'refs/heads/main' && 'deploy-cloudflare-production' || format('deploy-cloudflare-production-isolated-{0}', github.run_id) }}
  # A deploy in flight must finish. Wrangler uploads and activates a Worker
  # version, and cancelling part-way leaves it uploaded but not activated.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: harlan-zw/harlan-nuxt/.github/actions/harlan-desktop-setup@main
        with:
          node-version: 26.13.0
          # `postinstall` runs `nuxt prepare`, which the build depends on.
          install-args: ''

      - name: Cache for Nuxt SEO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache/nuxt-seo
          key: nuxt-skew-${{ github.sha }}
          restore-keys: |
            nuxt-skew-

      - name: Cache prerendered OG images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/og-image
          key: og-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'app/assets/**', 'app/components/OgImage/**', 'public/**') }}-${{ github.sha }}
          restore-keys: |
            og-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'nuxt.config.ts', 'app/assets/**', 'app/components/OgImage/**', 'public/**') }}-

      - run: pnpm build
        timeout-minutes: 30
        env:
          NODE_OPTIONS: --max-old-space-size=14000
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NUXT_GITHUB_AUTH_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
          NUXT_GITHUB_ACCESS_TOKEN: ${{ secrets.NUXT_GITHUB_ACCESS_TOKEN }}
          # Lets the sponsors module prerender its route. The config keeps the
          # runtimeConfig token empty, so the build does not bake it in.
          NUXT_GITHUB_SPONSORS_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
          NUXT_GITHUB_AUTH_CLIENT_SECRET: ${{ secrets.NUXT_GITHUB_AUTH_CLIENT_SECRET }}
          NUXT_EMAIL_OCTOPUS_TOKEN: ${{ secrets.NUXT_EMAIL_OCTOPUS_TOKEN }}
          NUXT_SEO_PRO_KEY: ${{ secrets.NUXT_SEO_PRO_KEY }}
          NUXT_GOOGLE_API_TOKEN: ${{ secrets.NUXT_GOOGLE_API_TOKEN }}
          NUXT_OAUTH_GITHUB_CLIENT_ID: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_ID }}
          NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_SECRET }}
          NUXT_OAUTH_GITHUB_REDIRECT_URL: ${{ secrets.NUXT_OAUTH_GITHUB_REDIRECT_URL }}
          NUXT_APP_SECRET: ${{ secrets.NUXT_APP_SECRET || secrets.NUXT_SESSION_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      # Nothing else creates the release. `@sentry/nuxt` never registers its
      # build plugin here (see the upload step below), and `sourcemaps upload
      # --release` only tags the artifact bundle. The finalize step after the
      # deploy failed with "Release not found" on its first two runs (#76).
      # Creating a release that already exists is a no-op.
      - name: Create Sentry release
        run: pnpm exec sentry-cli releases new "$SENTRY_RELEASE"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: harlan-zw
          SENTRY_PROJECT: unlighthouse
          SENTRY_RELEASE: ${{ github.sha }}

      # `@sentry/nuxt` only registers its source map upload plugin when a
      # `sentry.client.config.*` file exists, and this app configures Sentry
      # through `@harlan-zw/nuxt-sentry` instead. Without this step the hidden
      # client maps are never uploaded, and they ship to Cloudflare where
      # anyone can download them. The prefix is required: sentry-cli names
      # files after their path inside the given directory, and events report
      # chunks at `~/_nuxt/...`. The delete mirrors the module's own
      # `filesToDeleteAfterUpload` setting: maps are for Sentry only.
      - name: Upload client source maps to Sentry
        run: |
          pnpm exec sentry-cli sourcemaps upload --org harlan-zw --project unlighthouse --release "$SENTRY_RELEASE" --url-prefix '~/_nuxt' .output/public/_nuxt
          find .output/public/_nuxt -name '*.map' -delete
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      # Schema first, so the Worker version that needs a table never activates
      # before it exists. #59 shipped its throttle inert for this reason: the
      # code went live and the table had to be created by hand afterwards.
      # Migrations here are expand only, so applying them before the deploy
      # leaves the running version working against the wider schema.
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.local.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: pnpm deploy
        env:
          NUXT_NUXT_AI_READY_RUNTIME_SYNC_SECRET: ${{ secrets.NUXT_AI_READY_RUNTIME_SYNC_SECRET }}
          PUBLIC_EGRESS_VERSION_TAG: public-egress-v1-${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NUXT_CLOUDFLARE_ANALYTICS_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NUXT_EMAIL_OCTOPUS_TOKEN: ${{ secrets.NUXT_EMAIL_OCTOPUS_TOKEN }}
          NUXT_GITHUB_ACCESS_TOKEN: ${{ secrets.NUXT_GITHUB_ACCESS_TOKEN }}
          NUXT_GITHUB_AUTH_CLIENT_SECRET: ${{ secrets.NUXT_GITHUB_AUTH_CLIENT_SECRET }}
          NUXT_GITHUB_AUTH_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
          NUXT_GITHUB_SPONSORS_TOKEN: ${{ secrets.NUXT_GITHUB_AUTH_TOKEN }}
          NUXT_GOOGLE_API_TOKEN: ${{ secrets.NUXT_GOOGLE_API_TOKEN }}
          NUXT_OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.NUXT_OAUTH_GITHUB_CLIENT_SECRET }}
          NUXT_APP_SECRET: ${{ secrets.NUXT_APP_SECRET || secrets.NUXT_SESSION_PASSWORD }}

      # The build created the release for the sourcemap upload but nothing closed
      # it, so every release stayed (unreleased) and release health plus
      # deploy-based issue resolution never applied. #74
      - name: Finalize Sentry release and record the deploy
        run: |
          pnpm exec sentry-cli releases finalize "$SENTRY_RELEASE"
          pnpm exec sentry-cli releases deploys "$SENTRY_RELEASE" new -e production
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: harlan-zw
          SENTRY_PROJECT: unlighthouse
          SENTRY_RELEASE: ${{ github.sha }}

      # Reuse the deploy build. Reporting errors must not change deployment status.
      - name: Report Nuxt DX budget
        id: dx_budget
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        timeout-minutes: 2
        uses: harlan-zw/harlan-nuxt/.github/actions/nuxt-dx-budget@36d8fbf0dec7a829f63683abbf1fdc6efa2e6697
        with:
          artifact-name: nuxt-dx-size-budget-v3-prod
          report-path: .nuxt/dx/size-budget.json
          threshold-kb: 10
          comment: 'false'
      - name: Surface unavailable size report
        if: steps.dx_budget.outcome == 'failure'
        run: |
          echo '::warning::Nuxt DX reporting failed. See the report step.'
          echo '### Nuxt DX report unavailable' >> "$GITHUB_STEP_SUMMARY"
          echo 'Reporting failed. The deployment result is unchanged.' >> "$GITHUB_STEP_SUMMARY"
