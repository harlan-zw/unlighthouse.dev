  # `nuxtseo-devtools-host` pins it, and only development loads it.
  - nuxtseo-layer-devtools@6.0.0
  - semver

autoInstallPeers: false

peerDependencyRules:
  allowedVersions:
    '@nuxt/kit': '^3.2.0 || ^4.0.0'

shellEmulator: true

overrides:
  esbuild: ^0.28.1
  fast-uri: ^3.1.6
  nanotar: ^0.2.1
  qs: ^6.16.0
  vite: ^8.2.1

  vue: 3.5.43

allowBuilds:
  '@mongodb-js/zstd': true
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js-pure: true
  esbuild: true
  maplibre-gl: true
  node-liblzma: true
  sharp: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true

ignoredBuiltDependencies:
  - esbuild

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - maplibre-gl
  - sharp
  - simple-git-hooks
  - vue-demi
  - workerd

