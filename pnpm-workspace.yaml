minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@harlan-zw/nuxt-cloudflare'
  - '@comark/nuxt'
  - '@comark/vue'
  - comark
  - '@harlan-zw/nuxt-dx@0.1.2'
  - '@harlan-zw/nuxt-sentry@0.1.4'
  - '@harlan-zw/nuxt-github-sponsors@0.1.4'
  - '@types/three@0.185.0'
  - nuxt-ai-ready@2.3.1
  - nuxt-skew-protection@1.5.2
  - nuxtseo-shared@5.3.11 || 5.3.12
  - sitemapd@0.2.2
  - '@nuxtjs/seo@5.3.14'
  - '@harlan-zw/comark-content'
  - rangi
  - '@nuxt/scripts@2.0.0-beta.3'
  - eslint-plugin-harlanzw@0.21.1

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 262800

trustPolicyExclude:
  - chokidar
  - semver

autoInstallPeers: false

peerDependencyRules:
  allowedVersions:
    '@nuxt/kit': '^3.2.0 || ^4.0.0'

shellEmulator: true

overrides:
  esbuild: ^0.28.1
  fast-uri: ^3.1.6
  nanotar: ^0.2.1
  qs: ^6.16.0
  vite: ^8.2.1

allowBuilds:
  '@mongodb-js/zstd': true
  '@parcel/watcher': true
  '@sentry/cli': true
  core-js-pure: true
  esbuild: true
  maplibre-gl: true
  node-liblzma: true
  sharp: true
  simple-git-hooks: true
  vue-demi: true
  workerd: true

ignoredBuiltDependencies:
  - esbuild

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - maplibre-gl
  - sharp
  - simple-git-hooks
  - vue-demi
  - workerd

